<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Catalog with sign-in</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", sans-serif; }
    body { margin: 0; background: #f9fafb; color: #111827; }
    .hero { min-height: 120vh; padding: 32px 16px; box-sizing: border-box; }
    .sign-in { max-width: 24rem; margin: 0 auto 64px; padding: 16px; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; }
    h1 { font-size: 1.75rem; margin: 0 0 8px; }
    label { display: block; margin-bottom: 12px; }
    input { display: block; width: 100%; margin-top: 4px; padding: 8px; box-sizing: border-box; }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Public catalog</h1>
    <p>Scroll past this hero to reach sign-in. The login form is below the initial viewport.</p>
  </section>
  <section class="sign-in">
    <h2>Sign in</h2>
    <form>
      <label>Email <input type="email" autocomplete="username" name="email"></label>
      <label>Password <input type="password" autocomplete="current-password" name="password"></label>
      <button type="submit">Continue</button>
    </form>
  </section>
</body>
</html>
