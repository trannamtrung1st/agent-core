<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Human verification required</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", sans-serif; }
    body { margin: 0; background: #f3f4f6; color: #111827; }
    main { max-width: 40rem; margin: 0 auto; padding: 32px 16px; }
    section { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { margin: 0; line-height: 1.5; }
    .g-recaptcha { min-height: 78px; min-width: 304px; border: 1px dashed #d1d5db; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Human verification required</h1>
      <p>This site is asking a person to confirm the visit. The browser can stay open while that check is completed.</p>
      <div class="g-recaptcha" data-sitekey="fixture"></div>
    </section>
  </main>
</body>
</html>
