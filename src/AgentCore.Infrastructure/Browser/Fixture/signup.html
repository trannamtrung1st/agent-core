<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Create account</title></head>
<body>
  <main>
    <h1>Create account</h1>
    <form>
      <label>Email <input type="email" autocomplete="email" name="email"></label>
      <label>Password <input type="password" autocomplete="new-password" name="password"></label>
      <button type="submit">Create account</button>
    </form>
  </main>
</body>
</html>
