<!doctype html><html><head><title>Credential sign in</title></head><body>
<h1>Existing account sign in</h1><form id="login"><label for="username">Username</label><input id="username" autocomplete="username">
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password"><button type="submit">Sign in</button></form>
<p id="reflection"></p><p id="status"></p>
<script>
const reflect = new URL(location.href).searchParams.has('reflect');
const password = document.getElementById('password'), login = document.getElementById('login'), reflection = document.getElementById('reflection'), result = document.getElementById('status');
const mode = new URL(location.href).searchParams.get('mode');
if (['reset', 'change', 'new'].includes(mode)) login.prepend(document.createTextNode(mode + ' password'));
if (mode === 'new') password.autocomplete = 'new-password';
password.addEventListener('input', () => { if(reflect) { reflection.replaceChildren(document.createTextNode(password.value), document.createElement('span')); reflection.lastChild.textContent = ' reflected'; } });
function signedIn() { login.remove(); result.textContent = 'Signed in. Store orders: AC-CREDENTIAL-1042.'; const signout = document.createElement('button'); signout.textContent = 'Sign out'; signout.onclick = () => { if(confirm('Sign out of this account?')) { localStorage.removeItem('fixture-authenticated'); location.reload(); } }; document.body.append(signout); }
login.addEventListener('submit', e => { e.preventDefault(); localStorage.setItem('fixture-authenticated', 'yes'); signedIn(); });
if(localStorage.getItem('fixture-authenticated') === 'yes') { signedIn(); }
</script></body></html>
