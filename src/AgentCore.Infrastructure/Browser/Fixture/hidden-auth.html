<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Public catalog</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", sans-serif; }
    body { margin: 0; background: #f9fafb; color: #111827; }
    main { max-width: 40rem; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 1.75rem; margin: 0 0 8px; }
    p { margin: 0; line-height: 1.5; }
    dialog { display: none; }
    .vault { display: none; visibility: hidden; }
    .inactive-captcha { opacity: 0; }
    .inactive-captcha .g-recaptcha { min-width: 304px; min-height: 78px; }
    .offscreen-templates {
      position: absolute;
      left: -12000px;
      top: 0;
      width: 320px;
    }
    .offscreen-templates input { display: block; width: 240px; height: 32px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Public catalog</h1>
    <p>Browse products without signing in. Hidden login templates below must not trigger intervention.</p>
  </main>

  <dialog id="login-modal" aria-hidden="true">
    <form>
      <label>Email <input type="email" autocomplete="username" value="hidden@example.test"></label>
      <label>Password <input type="password" autocomplete="current-password" value="hidden-password"></label>
    </form>
  </dialog>

  <div hidden aria-hidden="true">
    <input type="password" autocomplete="current-password">
    <input autocomplete="one-time-code" name="otp" value="000000">
    <div class="cf-turnstile" data-sitekey="hidden-fixture"></div>
    <iframe src="/offline-captcha-shell.html?ref=challenges.cloudflare.com" title="hidden captcha" width="1" height="1"></iframe>
  </div>

  <div class="vault" inert>
    <input type="password" disabled autocomplete="new-password">
    <input type="email" autocomplete="email">
  </div>

  <template>
    <input type="password" autocomplete="current-password">
  </template>

  <div class="inactive-captcha">
    <div class="g-recaptcha" data-sitekey="dormant"></div>
  </div>

  <div class="offscreen-templates">
    <input type="password" autocomplete="current-password">
    <input autocomplete="one-time-code" name="otp-offscreen">
    <div class="h-captcha" data-sitekey="offscreen"></div>
  </div>
</body>
</html>
