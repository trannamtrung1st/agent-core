<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AC-1042</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", sans-serif; }
    body { margin: 0; background: #f3f4f6; color: #111827; }
    main { max-width: 40rem; margin: 0 auto; padding: 32px 16px; }
    a { color: #1f2937; }
    h1 { font-size: 1.75rem; margin: 8px 0; }
    p { margin: 0 0 16px; }
    section { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; }
    dl { display: grid; grid-template-columns: 8rem 1fr; gap: 8px 16px; margin: 0 0 16px; }
    dt { color: #4b5563; }
    dd { margin: 0; }
    label { display: block; margin-bottom: 8px; }
    select { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; }
    a:focus-visible, select:focus-visible { outline: 2px solid #1f2937; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p><a href="/">Records</a></p>
    <h1><a href="/records/AC-1042">AC-1042</a></h1>
    <p>In review</p>
    <section>
      <h2>Record details</h2>
      <dl>
        <dt>Status</dt>
        <dd>In review</dd>
        <dt>Owner</dt>
        <dd>Demo Operations</dd>
      </dl>
      <label for="stage">Stage</label>
      <select id="stage">
        <option value="in-review">In review</option>
        <option value="closed">Closed</option>
      </select>
    </section>
  </main>
</body>
</html>
