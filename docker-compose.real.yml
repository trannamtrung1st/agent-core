# Real/hosted overlay for the same one-container image and SQLite volume.
# Default `docker compose up` stays Synthetic and key-free.
#
#   docker compose -f docker-compose.yml -f docker-compose.real.yml up --build
#
# Matches the native http-openrouter launch profile: hosted OpenRouter text + tools.
# Copy `.env.example` to a gitignored `.env` and set OPENROUTER_API_KEY.
# Compose loads `.env` from the repo root for interpolation. AGENTCORE_LLM_MODEL
# sets primary-llm DefaultModel; when it matches a catalog ModelId the factory
# retargets DefaultKey. Do not use openrouter/free as DefaultModel (it remains a
# catalog option). Do not rewrite the DeepSeek catalog identity with that env
# var. Hosted STT/TTS are not selected here; Real voice stays unavailable until
# those adapters are resolved at startup. Never commit secrets.

services:
  agent-core:
    environment:
      AgentCore__Profile: Real
      Providers__LanguageModels__primary-llm__Adapter: OpenAICompatible
      Providers__LanguageModels__primary-llm__BaseUrl: https://openrouter.ai/api/v1/
      Providers__LanguageModels__primary-llm__DefaultModel: ${AGENTCORE_LLM_MODEL:-deepseek/deepseek-v4.1-flash}
      Providers__LanguageModels__primary-llm__ReasoningEffort: ${AGENTCORE_LLM_REASONING_EFFORT:-medium}
      Providers__LanguageModels__primary-llm__ReasoningObjectWire: "true"
      Providers__LanguageModels__primary-llm__ExcludeVisibleReasoning: "true"
      Providers__LanguageModels__primary-llm__Vision: ${AGENTCORE_LLM_VISION:-false}
      Providers__LanguageModels__primary-llm__Tools: ${AGENTCORE_LLM_TOOLS:-true}
      Providers__ModelCatalog__DefaultKey: deepseek-v41-flash
      Providers__ModelCatalog__Models__0__Key: deepseek-v41-flash
      Providers__ModelCatalog__Models__0__DisplayName: DeepSeek V4.1 Flash
      Providers__ModelCatalog__Models__0__ProviderAlias: primary-llm
      Providers__ModelCatalog__Models__0__ModelId: deepseek/deepseek-v4.1-flash
      Providers__ModelCatalog__Models__0__Tools: ${AGENTCORE_LLM_TOOLS:-true}
      Providers__ModelCatalog__Models__0__Vision: ${AGENTCORE_LLM_VISION:-false}
      Providers__ModelCatalog__Models__0__StructuredOutput: "false"
      Providers__ModelCatalog__Models__0__Reasoning: "true"
      Providers__ModelCatalog__Models__0__SupportedReasoningEfforts__0: low
      Providers__ModelCatalog__Models__0__SupportedReasoningEfforts__1: medium
      Providers__ModelCatalog__Models__0__SupportedReasoningEfforts__2: high
      Providers__ModelCatalog__Models__0__DefaultReasoningEffort: ${AGENTCORE_LLM_REASONING_EFFORT:-medium}
      Providers__ModelCatalog__Models__1__Key: gpt-4o-mini-2024-07-18
      Providers__ModelCatalog__Models__1__DisplayName: GPT-4o mini 2024-07-18
      Providers__ModelCatalog__Models__1__ProviderAlias: primary-llm
      Providers__ModelCatalog__Models__1__ModelId: openai/gpt-4o-mini-2024-07-18
      Providers__ModelCatalog__Models__1__Tools: "true"
      Providers__ModelCatalog__Models__1__Vision: "true"
      Providers__ModelCatalog__Models__1__StructuredOutput: "true"
      Providers__ModelCatalog__Models__1__Reasoning: "false"
      Providers__ModelCatalog__Models__2__Key: openrouter-free
      Providers__ModelCatalog__Models__2__DisplayName: OpenRouter Free
      Providers__ModelCatalog__Models__2__ProviderAlias: primary-llm
      Providers__ModelCatalog__Models__2__ModelId: openrouter/free
      Providers__ModelCatalog__Models__2__Tools: "true"
      Providers__ModelCatalog__Models__2__Vision: "false"
      Providers__ModelCatalog__Models__2__StructuredOutput: "false"
      Providers__ModelCatalog__Models__2__Reasoning: "false"
      Providers__ModelCatalog__Models__2__CostCategory: free
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required for Real Compose}
