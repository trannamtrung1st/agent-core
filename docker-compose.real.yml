# Real/hosted overlay for the same one-container image and SQLite volume.
# The base profile stays Synthetic and key-free; authenticated launch uses HTTPS.
#
#   docker compose -f docker-compose.yml -f docker-compose.real.yml -f docker-compose.https.yml up --build -d
#
# Initialize IAM explicitly, then configure the tenant's protected model credential,
# connection, offerings and default through AI models. Real boot needs no model key.
# Set AGENTCORE_TLS_CERTIFICATE_PATH (absolute private PFX readable by UID 1654)
# and AGENTCORE_TLS_PASSWORD. Speech adapters remain independently configured.
# See docs/17-observability-and-operations.md for first-run setup.

services:
  agent-core:
    image: agent-core:real
    environment:
      AgentCore__Profile: Real
      GoogleOAuth__ClientId: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GoogleOAuth__ClientSecret: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GoogleOAuth__PublicAppUrl: ${GOOGLE_OAUTH_PUBLIC_APP_URL:-}
      Email__SendEnabled: ${AGENTCORE_EMAIL_SEND_ENABLED:-${AGENTCORE_EMAIL_SMTP_ENABLED:-true}}
      Email__SmtpEnabled: ${AGENTCORE_EMAIL_SMTP_ENABLED:-true}
