# Authenticated Synthetic app, after explicit identity bootstrap:
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up --build -d
# Set AGENTCORE_TLS_CERTIFICATE_PATH to an absolute, private PFX readable by the
# container UID (1654), and AGENTCORE_TLS_PASSWORD to its password in private .env
# or the calling environment. Bootstrap/certificate setup:
# docs/17-observability-and-operations.md#docker-compose-integration-and-demo
# The base HTTP file alone exposes health/static content, not Account authentication.
services:
  agent-core:
    build:
      context: .
      dockerfile: Dockerfile
      # MessagePack stays the default. JSON inspection is a frontend build arg (baked at SPA build):
      # docker compose -f docker-compose.yml -f docker-compose.https.yml build --build-arg VITE_AGENTCORE_REALTIME_PROTOCOL=json
      # docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
      # Runtime/container env after build does not change the protocol.
    image: agent-core:synthetic
    ports:
      - "127.0.0.1:${AGENTCORE_COMPOSE_PORT:-5080}:8080"
    environment:
      AgentCore__Profile: Synthetic
      GoogleDrive__Enabled: "${AGENTCORE_DRIVE_ENABLED:-true}"
      AgentCore__AgentDirectory: /app/agents
      Persistence__Provider: Sqlite
      Persistence__ConnectionString: Data Source=/data/agent-core.db
      Persistence__CredentialProtectionKeyRoot: /data/credential-protection-keys
      Persistence__WorkspaceRoot: /data/workspaces
      Persistence__DefinitionResourceRoot: /data/definition-resources
      Persistence__AttachmentRoot: /data/attachments
      Persistence__ArtifactRoot: /data/artifacts
      # This image does not install Chromium. Leave browser tools off until that runtime is packaged.
      Browser__Enabled: "false"
      # Cookie authentication requires HTTPS. Use docker-compose.https.yml with
      # an operator-supplied certificate; HTTP alone exposes health/static only.
    volumes:
      - agent-core-data:/data
    # Native `dotnet run` + Vite remains the fast loop. This service is the
    # optional key-free Synthetic demo path (one app container + built SPA +
    # persistent SQLite volume). `docker compose down` keeps the volume;
    # `docker compose down -v` destroys it.
    # Real/hosted: docker compose -f docker-compose.yml -f docker-compose.real.yml -f docker-compose.https.yml up --build -d
    # Do not put provider keys in this file.

volumes:
  agent-core-data:
