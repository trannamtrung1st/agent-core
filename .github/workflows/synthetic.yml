name: synthetic

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    # Skip when the push changes only root TODO.md; still run if TODO.md changes with any other file.
    paths-ignore:
      - "TODO.md"
  pull_request:
    paths-ignore:
      - "TODO.md"

# A newer candidate replaces obsolete work only within the same branch or PR.
# Keep PR runs separate from push runs and from other branches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# These gates intentionally have no job dependencies: separate runners shorten the
# critical path without changing test workers, project coverage, or SQLite isolation.
# Repeated tool/dependency setup is cheaper than serial developer feedback.
jobs:
  backend:
    name: Synthetic backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      CI: "true"
      Browser__Headless: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          # Milestone evidence must test the candidate's exact behavior commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/realtime-js/package-lock.json

      - name: Restore JavaScript protocol fixture
        working-directory: tests/realtime-js
        run: npm ci

      - name: Backend Domain tests
        run: dotnet test tests/AgentCore.Domain.Tests/AgentCore.Domain.Tests.csproj --nologo

      - name: Event storage monitoring tests
        run: python3 -m unittest discover -s scripts/tests -p test_event_storage_snapshot.py -v

      - name: Build Infrastructure tests
        run: dotnet build tests/AgentCore.Infrastructure.Tests/AgentCore.Infrastructure.Tests.csproj --nologo

      - name: Prepare Ubuntu browser dependencies
        run: sudo python3 scripts/prepare-ci-apt.py

      - name: Install .NET Playwright Chromium
        run: pwsh tests/AgentCore.Infrastructure.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Backend Infrastructure tests
        run: dotnet test tests/AgentCore.Infrastructure.Tests/AgentCore.Infrastructure.Tests.csproj --nologo

      - name: Backend Application tests
        run: dotnet test tests/AgentCore.Application.Tests/AgentCore.Application.Tests.csproj --nologo --blame-hang --blame-hang-timeout 5m

      - name: Backend API tests
        run: dotnet test tests/AgentCore.Api.Tests/AgentCore.Api.Tests.csproj --nologo

  frontend:
    name: Synthetic frontend (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          # Milestone evidence must test the candidate's exact behavior commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Frontend install, unit tests, and build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          # Large Admin AntD trees compete for CPU in jsdom on hosted runners.
          # Independent runners preserve one worker, fresh file isolation and
          # existing test/job timeouts while covering every file across two shards.
          pnpm run test --run --maxWorkers=1 --shard=${{ matrix.shard }}/2
          pnpm run build

  playwright-core:
    name: Synthetic Playwright core (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      CI: "true"
      Browser__Headless: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          # Milestone evidence must test the candidate's exact behavior commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Backend browser tools use the .NET Playwright browser revision as well.
      # Build the actual host and install its Chromium on each isolated browser runner.
      - name: Build Synthetic API host
        run: dotnet build src/AgentCore.Api/AgentCore.Api.csproj --nologo

      - name: Prepare Ubuntu browser dependencies
        run: sudo python3 scripts/prepare-ci-apt.py

      - name: Install .NET Playwright Chromium
        run: pwsh src/AgentCore.Api/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: web
        run: pnpm exec playwright install chromium --with-deps

      - name: Synthetic Playwright
        working-directory: web
        run: |
          pnpm exec playwright test \
            --project=synthetic \
            --project=browser-stt \
            --project=browser-browser \
            --shard=${{ matrix.shard }}/2
        # Chromium fake media devices only: text, capture PCM, playback, and duplex mute/disconnect. No keys, mic, speaker, or GPU.

      - name: Upload Playwright failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-core-failure-${{ matrix.shard }}
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore

  # Acceptance projects stay sequential on their own runner, retaining each
  # project's dedicated database and server lifecycle. Do not merge the invocations.
  playwright-acceptance:
    name: Synthetic Playwright acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      CI: "true"
      Browser__Headless: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          # Milestone evidence must test the candidate's exact behavior commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Backend browser tools use the .NET Playwright browser revision as well.
      # Build the actual host and install its Chromium on each isolated browser runner.
      - name: Build Synthetic API host
        run: dotnet build src/AgentCore.Api/AgentCore.Api.csproj --nologo

      - name: Prepare Ubuntu browser dependencies
        run: sudo python3 scripts/prepare-ci-apt.py

      - name: Install .NET Playwright Chromium
        run: pwsh src/AgentCore.Api/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: web
        run: pnpm exec playwright install chromium --with-deps

      - name: Faithful Manual-A wall-clock Playwright
        working-directory: web
        run: |
          rm -f ../data/playwright/manual-a.db
          PLAYWRIGHT_SQLITE_PATH=../data/playwright/manual-a.db \
          PLAYWRIGHT_FAITHFUL_MANUAL=1 \
            pnpm exec playwright test --project=faithful-manual

      - name: P7G whole-phase Admin lifecycle Playwright
        working-directory: web
        run: |
          rm -f ../data/playwright/admin-lifecycle-isolated.db
          PLAYWRIGHT_SQLITE_PATH=../data/playwright/admin-lifecycle-isolated.db \
            pnpm exec playwright test --project=admin-lifecycle

      - name: P7.6 Admin journey Playwright
        working-directory: web
        run: |
          rm -f ../data/playwright/p76-admin.db
          PLAYWRIGHT_SQLITE_PATH=../data/playwright/p76-admin.db \
            pnpm exec playwright test --project=p76-admin

      - name: P9.7 harness management Playwright
        working-directory: web
        run: |
          rm -f ../data/playwright/p97-harness.db
          PLAYWRIGHT_SQLITE_PATH=../data/playwright/p97-harness.db \
          PLAYWRIGHT_FAITHFUL_MANUAL=1 \
            pnpm exec playwright test --project=p97-harness

      - name: P9.8/P9.9 continuity Playwright
        working-directory: web
        run: |
          rm -f ../data/playwright/p9899-continuity.db
          PLAYWRIGHT_SQLITE_PATH=../data/playwright/p9899-continuity.db \
            pnpm exec playwright test --project=p9899-continuity

      - name: P9.10 identity maintenance Playwright
        working-directory: web
        run: |
          PLAYWRIGHT_SQLITE_PATH=../data/playwright/p910-maintenance.db \
          PLAYWRIGHT_FAITHFUL_MANUAL=1 \
            pnpm exec playwright test --project=p910-continuity-maintenance

      - name: Secretary journey Playwright
        working-directory: web
        run: |
          PLAYWRIGHT_SQLITE_PATH=../data/playwright/secretary-demo.db \
          PLAYWRIGHT_FAITHFUL_MANUAL=1 \
            pnpm exec playwright test --project=secretary-demo

      - name: Upload Playwright failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-acceptance-failure
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore

  compose-smoke:
    name: Synthetic Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Owner-capability path and SQLite volume survival
        run: ./scripts/compose-sqlite-volume.sh
